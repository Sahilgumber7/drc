<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Delhi Run Collective — Creative Review Hub</title>
  
  <!-- Premium Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;500;600;700;800&family=Playfair+Display:ital,wght@0,600;1,600&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
  
  <!-- FontAwesome -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

  <style>
    :root {
      --bg: #07080A;
      --card-bg: rgba(17, 20, 26, 0.7);
      --card-active: #131720;
      --border: rgba(255, 255, 255, 0.08);
      --border-hover: rgba(197, 168, 128, 0.3);
      --border-active: #C5A880;
      --text: #F5F5F7;
      --text-muted: #8E939E;
      --gold: #C5A880;
      --gold-glow: rgba(197, 168, 128, 0.15);
      --accent: #FF5A36;
      --accent-glow: rgba(255, 90, 54, 0.15);
      --badge-blue: #38BDF8;
      --font-main: 'Plus Jakarta Sans', sans-serif;
      --font-serif: 'Playfair Display', serif;
      --font-mono: 'JetBrains Mono', monospace;
    }

    *, *::before, *::after {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      background-color: var(--bg);
      color: var(--text);
      font-family: var(--font-main);
      height: 100vh;
      height: 100dvh;
      overflow: hidden;
      display: flex;
      flex-direction: column;
      -webkit-font-smoothing: antialiased;
    }

    /* Header */
    header {
      height: 72px;
      border-bottom: 1px solid var(--border);
      background-color: rgba(7, 8, 10, 0.9);
      backdrop-filter: blur(16px);
      -webkit-backdrop-filter: blur(16px);
      padding: 0 24px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      flex-shrink: 0;
      z-index: 40;
    }

    .brand {
      display: flex;
      align-items: center;
      gap: 14px;
    }

    .brand img {
      height: 32px;
      object-fit: contain;
      filter: invert(1) brightness(1.8);
      transition: transform 0.3s ease;
    }

    .brand img:hover {
      transform: scale(1.05);
    }

    .brand-meta {
      display: flex;
      flex-direction: column;
    }

    .brand-title-wrap {
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .brand-title {
      font-size: 15px;
      font-weight: 800;
      text-transform: uppercase;
      letter-spacing: 0.14em;
      background: linear-gradient(135deg, #FFFFFF 0%, #C5A880 100%);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
    }

    .brand-subtitle {
      font-family: var(--font-serif);
      font-style: italic;
      color: var(--gold);
      font-size: 13px;
    }

    .header-actions {
      display: flex;
      align-items: center;
      gap: 16px;
    }

    /* Search Bar in Header */
    .search-box {
      position: relative;
      display: flex;
      align-items: center;
    }

    .search-box i {
      position: absolute;
      left: 14px;
      color: var(--text-muted);
      font-size: 13px;
      pointer-events: none;
    }

    .search-input {
      background: rgba(255, 255, 255, 0.04);
      border: 1px solid var(--border);
      border-radius: 99px;
      padding: 8px 16px 8px 36px;
      color: var(--text);
      font-size: 13px;
      font-family: var(--font-main);
      width: 220px;
      transition: all 0.25s cubic-bezier(0.16, 1, 0.3, 1);
    }

    .search-input:focus {
      outline: none;
      width: 280px;
      background: rgba(255, 255, 255, 0.07);
      border-color: var(--border-active);
      box-shadow: 0 0 16px var(--gold-glow);
    }

    .search-input::placeholder {
      color: var(--text-muted);
    }

    .live-tag {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      padding: 6px 14px;
      border-radius: 99px;
      background: rgba(197, 168, 128, 0.1);
      border: 1px solid rgba(197, 168, 128, 0.25);
      font-size: 11px;
      font-weight: 700;
      letter-spacing: 0.08em;
      color: var(--gold);
      text-transform: uppercase;
    }

    .live-dot {
      width: 7px;
      height: 7px;
      border-radius: 50%;
      background-color: #22C55E;
      box-shadow: 0 0 8px #22C55E;
      animation: pulse 2s infinite;
    }

    @keyframes pulse {
      0%, 100% { opacity: 1; transform: scale(1); }
      50% { opacity: 0.4; transform: scale(0.85); }
    }

    .mobile-toggle {
      display: none;
      background: rgba(255, 255, 255, 0.05);
      border: 1px solid var(--border);
      color: var(--text);
      width: 40px;
      height: 40px;
      border-radius: 10px;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      font-size: 16px;
    }

    /* Dashboard Layout */
    .dashboard {
      display: flex;
      flex: 1;
      overflow: hidden;
      position: relative;
    }

    /* Sidebar Drawer */
    .sidebar {
      width: 380px;
      border-right: 1px solid var(--border);
      background-color: rgba(11, 13, 18, 0.95);
      display: flex;
      flex-direction: column;
      overflow-y: auto;
      flex-shrink: 0;
      z-index: 30;
      transition: transform 0.3s cubic-bezier(0.16, 1, 0.3, 1);
    }

    .sidebar-header {
      padding: 20px 20px 16px;
      border-bottom: 1px solid var(--border);
      display: flex;
      flex-direction: column;
      gap: 14px;
      background: rgba(7, 8, 10, 0.4);
    }

    .sidebar-title-row {
      display: flex;
      align-items: center;
      justify-content: space-between;
    }

    .sidebar-title {
      font-size: 11px;
      font-weight: 800;
      text-transform: uppercase;
      letter-spacing: 0.15em;
      color: var(--text-muted);
    }

    .concept-count {
      font-size: 10px;
      font-weight: 700;
      background: rgba(255, 255, 255, 0.08);
      padding: 2px 8px;
      border-radius: 99px;
      color: var(--gold);
    }

    /* Tabs Filter */
    .category-tabs {
      display: flex;
      gap: 6px;
      overflow-x: auto;
      padding-bottom: 2px;
      scrollbar-width: none;
    }

    .category-tabs::-webkit-scrollbar {
      display: none;
    }

    .tab-btn {
      background: rgba(255, 255, 255, 0.03);
      border: 1px solid var(--border);
      color: var(--text-muted);
      padding: 6px 12px;
      border-radius: 8px;
      font-size: 11px;
      font-weight: 600;
      white-space: nowrap;
      cursor: pointer;
      transition: all 0.2s ease;
    }

    .tab-btn:hover {
      color: var(--text);
      border-color: rgba(255, 255, 255, 0.15);
    }

    .tab-btn.active {
      background: var(--gold-glow);
      border-color: var(--border-active);
      color: var(--gold);
    }

    .version-list {
      list-style: none;
      padding: 12px;
      display: flex;
      flex-direction: column;
      gap: 10px;
    }

    /* Version Card (Double Bezel Design) */
    .version-item {
      padding: 16px;
      border-radius: 14px;
      border: 1px solid var(--border);
      background-color: var(--card-bg);
      cursor: pointer;
      transition: all 0.25s cubic-bezier(0.16, 1, 0.3, 1);
      text-align: left;
      width: 100%;
      position: relative;
      overflow: hidden;
    }

    .version-item::before {
      content: '';
      position: absolute;
      top: 0; left: 0; bottom: 0;
      width: 3px;
      background: transparent;
      transition: background 0.25s ease;
    }

    .version-item:hover {
      background-color: rgba(255, 255, 255, 0.04);
      border-color: var(--border-hover);
      transform: translateY(-1px);
    }

    .version-item.active {
      background-color: var(--card-active);
      border-color: var(--border-active);
      box-shadow: 0 8px 30px rgba(0, 0, 0, 0.5), inset 0 1px 1px rgba(255, 255, 255, 0.1);
    }

    .version-item.active::before {
      background: var(--gold);
    }

    .version-meta {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 8px;
      gap: 8px;
    }

    .version-badge {
      font-size: 9px;
      font-weight: 800;
      padding: 4px 8px;
      border-radius: 6px;
      text-transform: uppercase;
      letter-spacing: 0.08em;
    }

    .badge-custom {
      background-color: rgba(197, 168, 128, 0.15);
      color: var(--gold);
      border: 1px solid rgba(197, 168, 128, 0.3);
    }

    .badge-tailwind {
      background-color: rgba(56, 189, 248, 0.15);
      color: var(--badge-blue);
      border: 1px solid rgba(56, 189, 248, 0.3);
    }

    .badge-pack {
      background-color: rgba(255, 90, 54, 0.15);
      color: var(--accent);
      border: 1px solid rgba(255, 90, 54, 0.3);
    }

    .version-filename {
      font-size: 10px;
      font-family: var(--font-mono);
      color: var(--text-muted);
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .version-title {
      font-size: 14px;
      font-weight: 700;
      color: var(--text);
      margin-bottom: 6px;
      line-height: 1.3;
    }

    .version-desc {
      font-size: 12px;
      color: var(--text-muted);
      line-height: 1.5;
    }

    .version-specs {
      display: flex;
      align-items: center;
      gap: 8px;
      margin-top: 10px;
      font-size: 11px;
      color: var(--gold);
      font-weight: 500;
    }

    /* Main Area / Preview */
    .preview-area {
      flex: 1;
      display: flex;
      flex-direction: column;
      background-color: #050608;
      position: relative;
      overflow: hidden;
    }

    /* Toolbar Controls */
    .toolbar {
      height: 56px;
      border-bottom: 1px solid var(--border);
      background-color: rgba(7, 8, 10, 0.6);
      backdrop-filter: blur(8px);
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 0 20px;
      flex-shrink: 0;
      z-index: 20;
      gap: 12px;
    }

    .view-controls {
      display: flex;
      align-items: center;
      gap: 6px;
    }

    .control-btn {
      background: rgba(255, 255, 255, 0.03);
      border: 1px solid var(--border);
      color: var(--text-muted);
      height: 34px;
      padding: 0 14px;
      border-radius: 8px;
      font-size: 12px;
      font-weight: 600;
      cursor: pointer;
      display: flex;
      align-items: center;
      gap: 7px;
      transition: all 0.2s ease;
    }

    .control-btn:hover {
      color: var(--text);
      border-color: rgba(255, 255, 255, 0.2);
    }

    .control-btn.active {
      background-color: var(--gold);
      color: #07080A;
      border-color: var(--gold);
      font-weight: 700;
      box-shadow: 0 0 12px rgba(197, 168, 128, 0.3);
    }

    .action-controls {
      display: flex;
      align-items: center;
      gap: 10px;
    }

    .icon-btn {
      background: rgba(255, 255, 255, 0.03);
      border: 1px solid var(--border);
      color: var(--text-muted);
      width: 34px;
      height: 34px;
      border-radius: 8px;
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      transition: all 0.2s ease;
    }

    .icon-btn:hover {
      color: var(--text);
      border-color: rgba(255, 255, 255, 0.2);
    }

    .action-btn {
      background-color: var(--gold);
      color: #07080A;
      border: none;
      height: 34px;
      padding: 0 14px;
      border-radius: 8px;
      font-size: 11px;
      font-weight: 800;
      text-transform: uppercase;
      letter-spacing: 0.06em;
      cursor: pointer;
      display: flex;
      align-items: center;
      gap: 8px;
      text-decoration: none;
      transition: all 0.2s ease;
    }

    .action-btn:hover {
      background-color: #d6b88f;
      box-shadow: 0 0 14px var(--gold-glow);
    }

    /* Iframe Wrapper */
    .iframe-container {
      flex: 1;
      padding: 20px;
      display: flex;
      align-items: center;
      justify-content: center;
      overflow: hidden;
      position: relative;
    }

    .iframe-wrapper {
      width: 100%;
      height: 100%;
      border-radius: 16px;
      overflow: hidden;
      border: 1px solid var(--border);
      background-color: #000000;
      box-shadow: 0 24px 60px rgba(0, 0, 0, 0.7);
      transition: width 0.4s cubic-bezier(0.16, 1, 0.3, 1);
      position: relative;
    }

    .iframe-wrapper iframe {
      width: 100%;
      height: 100%;
      border: none;
    }

    /* Loading Overlay */
    .iframe-loader {
      position: absolute;
      inset: 0;
      background: rgba(7, 8, 10, 0.85);
      backdrop-filter: blur(8px);
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 12px;
      z-index: 15;
      opacity: 0;
      pointer-events: none;
      transition: opacity 0.2s ease;
    }

    .iframe-loader.active {
      opacity: 1;
      pointer-events: auto;
    }

    .spinner {
      width: 32px;
      height: 32px;
      border: 3px solid rgba(197, 168, 128, 0.2);
      border-top-color: var(--gold);
      border-radius: 50%;
      animation: spin 0.8s linear infinite;
    }

    @keyframes spin {
      to { transform: rotate(360deg); }
    }

    .loader-text {
      font-size: 12px;
      font-weight: 600;
      color: var(--text-muted);
      letter-spacing: 0.05em;
    }

    /* Mobile Backdrop Overlay */
    .sidebar-overlay {
      display: none;
      position: fixed;
      inset: 0;
      background: rgba(0, 0, 0, 0.6);
      backdrop-filter: blur(4px);
      z-index: 25;
    }

    /* Responsive Breakpoints */
    @media (max-width: 1024px) {
      .mobile-toggle {
        display: flex;
      }

      .sidebar {
        position: fixed;
        top: 72px;
        bottom: 0;
        left: 0;
        transform: translateX(-100%);
        width: 320px;
        box-shadow: 10px 0 30px rgba(0, 0, 0, 0.5);
      }

      .sidebar.open {
        transform: translateX(0);
      }

      .sidebar-overlay.open {
        display: block;
      }

      .search-input {
        width: 160px;
      }
      .search-input:focus {
        width: 200px;
      }
    }

    @media (max-width: 640px) {
      header {
        padding: 0 16px;
      }
      .brand-subtitle, .live-tag {
        display: none;
      }
      .toolbar {
        padding: 0 12px;
      }
      .control-btn span {
        display: none;
      }
      .control-btn {
        padding: 0 10px;
      }
      .search-box {
        display: none;
      }
    }
  </style>
</head>
<body>

  <!-- HEADER -->
  <header>
    <div class="brand">
      <img alt="Delhi Run Collective Logo" src="https://delhiruncollective.com/cdn/shop/files/LOGO_streached_1.png"/>
      <div class="brand-meta">
        <div class="brand-title-wrap">
          <span class="brand-title">Delhi Run Collective</span>
        </div>
        <span class="brand-subtitle">Creative Sandbox & Concept Review Hub</span>
      </div>
    </div>

    <div class="header-actions">
      <!-- Search -->
      <div class="search-box">
        <i class="fa-solid fa-magnifying-glass"></i>
        <input type="text" id="searchInput" class="search-input" placeholder="Search concepts..." oninput="filterTemplates()">
      </div>

      <!-- Live status tag -->
      <div class="live-tag">
        <span class="live-dot"></span>
        <span id="activeTag">13 Concepts Ready</span>
      </div>

      <!-- Mobile drawer button -->
      <button class="mobile-toggle" onclick="toggleSidebar()" aria-label="Toggle Navigation">
        <i class="fa-solid fa-bars"></i>
      </button>
    </div>
  </header>

  <!-- SIDEBAR BACKDROP FOR MOBILE -->
  <div class="sidebar-overlay" id="sidebarOverlay" onclick="toggleSidebar()"></div>

  <!-- DASHBOARD -->
  <div class="dashboard">
    
    <!-- SIDEBAR -->
    <aside class="sidebar" id="sidebar">
      <div class="sidebar-header">
        <div class="sidebar-title-row">
          <h2 class="sidebar-title">Design Concepts</h2>
          <span class="concept-count" id="conceptCount">13 Versions</span>
        </div>
        <!-- Category Filters -->
        <div class="category-tabs">
          <button class="tab-btn active" onclick="setCategory('all', this)">All (13)</button>
          <button class="tab-btn" onclick="setCategory('custom', this)">Custom CSS (3)</button>
          <button class="tab-btn" onclick="setCategory('tailwind', this)">Tailwind (4)</button>
          <button class="tab-btn" onclick="setCategory('pack', this)">Pack (6)</button>
        </div>
      </div>

      <ul class="version-list" id="versionList">
        <!-- JS Populates List -->
      </ul>
    </aside>

    <!-- PREVIEW AREA -->
    <main class="preview-area">
      <!-- Toolbar -->
      <div class="toolbar">
        <!-- View Size Controls -->
        <div class="view-controls">
          <button class="control-btn active" id="btnDesktop" onclick="setFrameSize('desktop')">
            <i class="fa-solid fa-desktop"></i> <span>Desktop</span> (100%)
          </button>
          <button class="control-btn" id="btnLaptop" onclick="setFrameSize('laptop')">
            <i class="fa-solid fa-laptop"></i> <span>Laptop</span> (1024px)
          </button>
          <button class="control-btn" id="btnTablet" onclick="setFrameSize('tablet')">
            <i class="fa-solid fa-tablet-screen-button"></i> <span>Tablet</span> (768px)
          </button>
          <button class="control-btn" id="btnMobile" onclick="setFrameSize('mobile')">
            <i class="fa-solid fa-mobile-screen-button"></i> <span>Mobile</span> (375px)
          </button>
        </div>

        <!-- Action Controls -->
        <div class="action-controls">
          <button class="icon-btn" onclick="reloadFrame()" title="Reload Frame">
            <i class="fa-solid fa-rotate-right"></i>
          </button>
          <a href="#" class="action-btn" id="btnOpenNew" target="_blank" title="Open concept in new window">
            <i class="fa-solid fa-arrow-up-right-from-square"></i> Open In New Tab
          </a>
        </div>
      </div>

      <!-- Iframe Frame -->
      <div class="iframe-container">
        <div class="iframe-wrapper" id="frameWrapper">
          <div class="iframe-loader" id="iframeLoader">
            <div class="spinner"></div>
            <span class="loader-text">Loading Design Concept...</span>
          </div>
          <iframe id="previewFrame" src="" onload="hideLoader()"></iframe>
        </div>
      </div>
    </main>

  </div>

  <script>
    // Templates Metadata - Reordered per client preference (Real Delhi Comic #1 & #2, Orbit #3, Wireframe #4, Paceboard #5)
    const templates = [
      {
        id: "pack-05-v2",
        category: "pack",
        filename: "pack/05-real-delhi-comic-v2.html",
        title: "Real Geometry & Comic Strip (V2)",
        desc: "White/orange system showcasing a revolving real Delhi coordinate map and a six-panel canvas comic strip layout.",
        badge: "Redesign Pack V2",
        badgeStyle: "badge-pack",
        specs: "Didot / Avenir Next"
      },
      {
        id: "pack-05-v1",
        category: "pack",
        filename: "pack/05-real-delhi-comic.html",
        title: "Real Geometry & Comic Strip (V1)",
        desc: "Initial prototype of the real Delhi revolving coordinate map with interactive comic narrative panels.",
        badge: "Redesign Pack V1",
        badgeStyle: "badge-pack",
        specs: "Didot / Avenir Next"
      },
      {
        id: "pack-04-v2",
        category: "pack",
        filename: "pack/04-orbit-white-orange-v2.html",
        title: "Stylized Orbiting Districts (V2)",
        desc: "Light mode white + orange system focusing on an orbiting 11-district slab layout with interactive canvas.",
        badge: "Redesign Pack V2",
        badgeStyle: "badge-pack",
        specs: "Didot / Avenir Next"
      },
      {
        id: "pack-03-v2",
        category: "pack",
        filename: "pack/03-delhi-wireframe-dark-v2.html",
        title: "Delhi 3D Wireframe (V2)",
        desc: "Atmospheric wireframe dark theme displaying hand-plotted Delhi ring road geometries and neon route highlights.",
        badge: "Redesign Pack V2",
        badgeStyle: "badge-pack",
        specs: "Helvetica / SF Mono"
      },
      {
        id: "pack-01-v2",
        category: "pack",
        filename: "pack/01-paceboard-dark-v2.html",
        title: "Pace Board Dark Mode (V2)",
        desc: "Night-run committed dark theme featuring hi-vis yellow-green pace cards and a color-coded timing grid.",
        badge: "Redesign Pack V2",
        badgeStyle: "badge-pack",
        specs: "Helvetica / SF Mono"
      },
      {
        id: "pack-02-v2",
        category: "pack",
        filename: "pack/02-fivefourty-dawn-v2.html",
        title: "5:40 AM Pale-Lilac (V2)",
        desc: "Editorial zine direction utilizing sodium amber accents on cool pale-lilac backgrounds.",
        badge: "Redesign Pack V2",
        badgeStyle: "badge-pack",
        specs: "Didot / Avenir Next"
      },
      {
        id: "index-v2-live-v2",
        category: "custom",
        filename: "index-v2-live-v2.html",
        title: "Earthy Premium & Three.js (V2)",
        desc: "Custom CSS layout using custom cursor controls, horizontal feeling strips, and scroll-driven Three.js route line visualizations.",
        badge: "Custom CSS V2",
        badgeStyle: "badge-custom",
        specs: "Inter / Space Mono / Playfair"
      },
      {
        id: "theme-v2-v2",
        category: "custom",
        filename: "theme-v2-v2.html",
        title: "Cinematic Timeline & Marquee (V2)",
        desc: "High-contrast timeline version featuring scrolling progress lines, organic text reveal offsets, and a bold accent header style.",
        badge: "Custom CSS V2",
        badgeStyle: "badge-custom",
        specs: "Fraunces / Oswald / Inter"
      },
      {
        id: "theme-drc-v2",
        category: "custom",
        filename: "theme-drc-v2.html",
        title: "OLED Dark & Champagne Gold (V2)",
        desc: "Premium dark layout showcasing champagne gold details, double bezel card styles, and high energy neon highlights.",
        badge: "Custom CSS V2",
        badgeStyle: "badge-custom",
        specs: "Syne / Plus Jakarta Sans"

    let activeIndex = 0;
    let currentCategory = 'all';
    let searchQuery = '';

    // Render Version List
    function renderList() {
      const listEl = document.getElementById("versionList");
      listEl.innerHTML = "";

      const filtered = templates.filter(t => {
        const matchesCategory = currentCategory === 'all' || t.category === currentCategory;
        const matchesSearch = searchQuery === '' || 
          t.title.toLowerCase().includes(searchQuery.toLowerCase()) || 
          t.desc.toLowerCase().includes(searchQuery.toLowerCase()) ||
          t.filename.toLowerCase().includes(searchQuery.toLowerCase());
        return matchesCategory && matchesSearch;
      });

      document.getElementById("conceptCount").innerText = `${filtered.length} Versions`;

      if (filtered.length === 0) {
        listEl.innerHTML = `<li style="padding: 24px; text-align: center; color: var(--text-muted); font-size: 13px;">No design concepts match your search.</li>`;
        return;
      }

      filtered.forEach((t) => {
        const originalIndex = templates.findIndex(item => item.id === t.id);
        const li = document.createElement("li");
        li.innerHTML = `
          <button class="version-item ${originalIndex === activeIndex ? 'active' : ''}" onclick="selectTemplate(${originalIndex})">
            <div class="version-meta">
              <span class="version-badge ${t.badgeStyle}">${t.badge}</span>
              <span class="version-filename">${t.filename}</span>
            </div>
            <h3 class="version-title">${t.title}</h3>
            <p class="version-desc">${t.desc}</p>
            <div class="version-specs">
              <i class="fa-solid fa-font"></i> ${t.specs}
            </div>
          </button>
        `;
        listEl.appendChild(li);
      });
    }

    // Select Template action
    function selectTemplate(index) {
      activeIndex = index;
      showLoader();
      
      // Update sidebar state
      document.querySelectorAll(".version-item").forEach((btn) => {
        btn.classList.remove("active");
      });

      renderList();

      // Load Iframe
      const t = templates[index];
      const frame = document.getElementById("previewFrame");
      frame.src = t.filename;

      // Update Open New Tab action
      document.getElementById("btnOpenNew").href = t.filename;

      // Auto close sidebar on mobile
      if (window.innerWidth <= 1024) {
        closeSidebar();
      }
    }

    // Filter Categories
    function setCategory(cat, btn) {
      currentCategory = cat;
      document.querySelectorAll(".tab-btn").forEach(b => b.classList.remove("active"));
      btn.classList.add("active");
      renderList();
    }

    // Search Filter
    function filterTemplates() {
      searchQuery = document.getElementById("searchInput").value;
      renderList();
    }

    // Frame Sizing Controls
    function setFrameSize(device) {
      const wrapper = document.getElementById("frameWrapper");
      
      document.getElementById("btnDesktop").classList.toggle("active", device === 'desktop');
      document.getElementById("btnLaptop").classList.toggle("active", device === 'laptop');
      document.getElementById("btnTablet").classList.toggle("active", device === 'tablet');
      document.getElementById("btnMobile").classList.toggle("active", device === 'mobile');

      if (device === 'desktop') {
        wrapper.style.width = "100%";
      } else if (device === 'laptop') {
        wrapper.style.width = "1024px";
      } else if (device === 'tablet') {
        wrapper.style.width = "768px";
      } else if (device === 'mobile') {
        wrapper.style.width = "375px";
      }
    }

    // Iframe Reload & Loader
    function reloadFrame() {
      showLoader();
      const frame = document.getElementById("previewFrame");
      frame.src = frame.src;
    }

    function showLoader() {
      document.getElementById("iframeLoader").classList.add("active");
    }

    function hideLoader() {
      document.getElementById("iframeLoader").classList.remove("active");
    }

    // Mobile Sidebar Drawer Toggles
    function toggleSidebar() {
      document.getElementById("sidebar").classList.toggle("open");
      document.getElementById("sidebarOverlay").classList.toggle("open");
    }

    function closeSidebar() {
      document.getElementById("sidebar").classList.remove("open");
      document.getElementById("sidebarOverlay").classList.remove("open");
    }

    // Initial Load
    renderList();
    selectTemplate(activeIndex);
  </script>
</body>
